<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D7192A">
<title>Rings a Bell</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1F1; --ink:#1B1720; --panel:#FFFFFF; --soft:#FBE2E4; --muted:#665C6B;
  --hot:#D7192A; --on-hot:#FFFFFF; --go:#0B8A54; --on-go:#FFFFFF; --dial:#D7192A; --shadow:#1B1720;
  --hero:#D7192A; --on-hero:#FFFFFF; --clap:#1B1720;
  --display:"Secular One","Fredoka",system-ui,sans-serif;
  --body:"Fredoka",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141218; --ink:#F6EEEF; --panel:#221E28; --soft:#3B242A; --muted:#BDB2BF;
    --hot:#E8293D; --on-hot:#FFFFFF; --go:#22C47C; --on-go:#0B2318; --dial:#FF5A6A; --shadow:#000000;
    --hero:#B8141F; --on-hero:#FFFFFF; --clap:#141218;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 180px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0}
h2{font-size:26px}
h3{font-size:20px;margin-bottom:10px}
.screen{display:none}
.screen.on{display:block}
.hidden{display:none!important}

/* surfaces */
.card{background:var(--panel);border:2.5px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--shadow);padding:18px;margin-bottom:16px}
.center{text-align:center}

/* buttons */
.btn{font:600 18px/1.1 var(--body);border:2.5px solid var(--ink);border-radius:999px;padding:12px 20px;background:var(--panel);color:var(--ink);box-shadow:3px 3px 0 var(--shadow);cursor:pointer;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.primary{background:var(--hot);color:var(--on-hot)}
.btn.go{background:var(--go);color:var(--on-go)}
.btn.block{display:flex;width:100%}
.btn.small{min-height:44px;padding:8px 14px;font-size:16px}
.btn:disabled{opacity:.45;box-shadow:none;transform:none;cursor:default}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font:500 16px var(--body);padding:10px 6px;cursor:pointer}
.iconbtn{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ink);background:var(--panel);color:var(--ink);display:grid;place-items:center;box-shadow:2px 2px 0 var(--shadow);cursor:pointer;padding:0}
.iconbtn svg{width:24px;height:24px}
.iconbtn[aria-pressed="false"]{background:var(--soft)}
:focus-visible{outline:3px solid var(--dial);outline-offset:3px}

/* inputs */
.field{display:block;margin:0 0 16px}
.field>.lab{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=number],input[type=url],input[type=tel]{width:100%;font:500 18px var(--body);padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--panel);color:var(--ink);min-height:52px}
input::placeholder{color:var(--muted);opacity:.85}
input:disabled{background:var(--soft);opacity:.7}
.row{display:flex;gap:10px;align-items:stretch}
.row>input{flex:1;min-width:0}
.rule{border:0;border-top:2.5px dashed var(--soft);margin:18px 0}
.msg{margin:6px 0 0;font-weight:500;min-height:1.2em}
.msg.err{color:var(--hot)}
.hint{color:var(--muted);font-weight:500;margin:0 0 14px;text-align:center}
.credit{text-align:center;font-size:14px;color:var(--muted);margin-top:8px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:50px}
.tools{display:flex;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px}
.brand svg{width:34px;height:34px;color:var(--hot)}
.brand .rc{font-family:var(--body);font-weight:600;font-size:15px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--panel);direction:ltr;unicode-bidi:isolate}

/* hero */
.hero{text-align:center;padding:2px 0 20px}
.heroart{position:relative;height:208px;border-radius:28px;background:var(--hero);color:var(--on-hero);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);overflow:hidden;margin-bottom:18px}
.heroart .staff{position:absolute;left:0;right:0;top:58px;height:62px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.3) 0 2px,transparent 2px 15px)}
.heroart .bigbell{position:absolute;left:50%;top:18px;width:132px;height:132px;margin:0 0 0 -66px;color:#fff;--clap:#1B1720}
.note{position:absolute;color:#fff;animation:float 3.4s ease-in-out infinite}
.n1{left:9%;top:26px;width:40px;height:40px}
.n2{right:9%;top:20px;width:46px;height:46px;animation-delay:-1.2s}
.n3{right:23%;top:100px;width:28px;height:28px;animation-delay:-2.1s}
.n4{left:22%;top:104px;width:28px;height:28px;animation-delay:-.7s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-10px) rotate(7deg)}}
.eq{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:0 22px}
.eq span{flex:1;max-width:13px;height:30%;background:rgba(255,255,255,.88);border-radius:4px 4px 0 0;animation:eq 1.15s ease-in-out infinite}
.eq span:nth-child(2n){animation-delay:-.35s}.eq span:nth-child(3n){animation-delay:-.7s}.eq span:nth-child(5n){animation-delay:-.95s}.eq span:nth-child(7n){animation-delay:-.2s}
@keyframes eq{0%,100%{height:18%}50%{height:96%}}
.bigbell{width:132px;height:132px;margin:0 auto 6px;transform-origin:50% 12%;color:var(--hot)}
.logo{font-size:clamp(48px,14vw,68px);letter-spacing:-.01em;line-height:1;direction:ltr}
.tag{font-size:19px;font-weight:500;margin:10px 0 0}

/* bell motion */
@keyframes ring{0%{transform:rotate(0)}12%{transform:rotate(16deg)}26%{transform:rotate(-13deg)}40%{transform:rotate(9deg)}54%{transform:rotate(-6deg)}68%{transform:rotate(3deg)}82%{transform:rotate(-1deg)}100%{transform:rotate(0)}}
.ring{animation:ring 1.1s ease-out}
.bellsvg{transform-origin:50% 14%}
@media (prefers-reduced-motion: reduce){.ring,.note,.eq span{animation:none}.btn,.fill,.needle{transition:none}}

/* lobby */
.codecap{font-weight:600;color:var(--muted)}
.code{font-family:var(--display);font-size:clamp(64px,22vw,96px);letter-spacing:.12em;line-height:1;margin:6px 0 14px;direction:ltr;unicode-bidi:isolate}
.players{list-style:none;margin:0;padding:0}
.players li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:2px dashed var(--soft);font-weight:500;font-size:18px}
.players li:last-child{border-bottom:0}
.players li.off{opacity:.45}
.badge{font-size:13px;font-weight:600;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;white-space:nowrap}
.plsum{display:flex;gap:12px;align-items:center}
.plsum img{width:56px;height:56px;border-radius:12px;border:2px solid var(--ink);object-fit:cover;flex:none}
.plsum .t{font-weight:600}
.plsum .s{color:var(--muted);font-size:15px}

/* setup */
.results{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:8px}
.results button{width:100%;display:flex;align-items:center;gap:12px;padding:8px;border:2px solid var(--ink);border-radius:14px;background:var(--panel);color:var(--ink);font:500 16px var(--body);text-align:start;cursor:pointer}
.results button:active{background:var(--soft)}
.results img{width:44px;height:44px;border-radius:8px;flex:none;object-fit:cover;background:var(--soft)}
.results .rt{font-weight:600;display:block}
.results .rs{font-size:14px;color:var(--muted)}
.picked{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:16px;padding:10px;margin-top:6px}
.picked img{width:64px;height:64px;border-radius:12px;border:2px solid var(--ink);object-fit:cover;flex:none}
.picked .t{font-weight:600;font-size:18px}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:2.5px solid var(--ink);border-radius:16px;margin-bottom:10px;cursor:pointer;flex-wrap:wrap}
.opt:has(input:checked){background:var(--soft)}
.opt input[type=radio]{width:22px;height:22px;accent-color:var(--hot);margin:0}
.opt .ol{flex:1;font-weight:500;min-width:140px}
.opt .num{display:flex;align-items:center;gap:6px}
.opt .num input{width:84px;min-height:44px;padding:6px 10px;text-align:center}

/* game: control panel pinned to the top */
.ctrl{position:sticky;top:0;z-index:25;background:var(--panel);border:2.5px solid var(--ink);border-top:0;border-radius:0 0 22px 22px;box-shadow:0 4px 0 var(--shadow);margin:-12px -6px 16px;padding:10px 12px 12px}
.ctrl-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ctrl-top .brand svg{width:28px;height:28px}
.ctrl-top .info{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
.ctrl-top .info .tl{display:block;color:var(--muted);font-weight:500;font-size:13px}
.iconbtn.sm{width:40px;height:40px;box-shadow:none}
.iconbtn.sm svg{width:20px;height:20px}
.stage{display:flex;align-items:center;gap:12px}
.stageinfo{flex:1;min-width:0}
.playbtn{width:66px;height:66px;border-radius:50%;border:3px solid var(--ink);background:var(--hot);color:var(--on-hot);display:grid;place-items:center;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;flex:none;padding:0}
.playbtn:active{transform:translate(3px,3px);box-shadow:none}
.playbtn svg{width:32px;height:32px}
@keyframes pulse{0%,100%{box-shadow:3px 3px 0 var(--shadow),0 0 0 0 var(--hot)}50%{box-shadow:3px 3px 0 var(--shadow),0 0 0 12px transparent}}
.playbtn.need{animation:pulse 1.2s infinite}
.secs{font-family:var(--display);font-size:36px;line-height:1}
.secs small{font-family:var(--body);font-size:16px;font-weight:600;margin-inline-start:5px}
.stagehint{color:var(--muted);font-weight:500;font-size:14px;margin-top:3px;line-height:1.3}
.dial{margin-top:14px;--p:0}
.trk{position:relative;height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--soft);margin:0 14px}
.trk.tap{cursor:pointer}
.fill{position:absolute;top:0;bottom:0;inset-inline-start:0;width:calc(var(--p) * 100%);background:var(--dial);border-radius:999px;transition:width .4s cubic-bezier(.3,1.4,.6,1)}
.needle{position:absolute;top:-10px;width:6px;height:30px;margin-inline-start:-3px;inset-inline-start:calc(var(--p) * 100%);background:var(--ink);border-radius:3px;transition:inset-inline-start .4s cubic-bezier(.3,1.4,.6,1)}
.stops{display:flex;justify-content:space-between;margin-top:6px}
.stops button{background:none;border:0;font:600 15px var(--body);color:var(--muted);min-width:34px;min-height:36px;padding:4px 2px;border-radius:10px;cursor:pointer}
.stops button.on{color:var(--ink)}
.stops button.cur{background:var(--ink);color:var(--panel)}
.stops button:disabled{cursor:default}
.hintval{display:inline-block;margin-top:8px;background:var(--soft);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:600}
.ctrl-btns{display:flex;gap:8px;margin-top:10px}
.ctrl-btns .btn{flex:1;min-height:46px;font-size:16px;padding:8px 10px;box-shadow:2px 2px 0 var(--shadow)}
.waitline{margin:8px 0 0;text-align:center;color:var(--muted);font-weight:500;font-size:15px}
.waitline:empty{display:none}
.stats{list-style:none;margin:0;padding:0}
.stats li{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:2px dashed var(--soft);font-weight:500}
.stats li:last-child{border-bottom:0}
.stats .k{flex:1}
.stats .pts{font-size:13px;color:var(--muted);font-weight:600;text-align:end}
.stats .v{font-family:var(--display);font-size:22px;min-width:40px;text-align:end}
.stats li.total{background:var(--soft);border-radius:12px;padding-inline:10px;border-bottom:0}
.scoring{font-size:14px;color:var(--muted);margin:10px 0 0}
.full{margin:0 0 8px}
.full iframe{border:0;width:100%;border-radius:12px;display:block}
.ytbox{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.ytbox iframe,.ytbox>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.fullnote{font-size:13px;color:var(--muted);margin:4px 0 6px}
input[type=range]{width:100%;accent-color:var(--hot);min-height:36px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.slot{background:var(--panel);border:2.5px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 var(--shadow);padding:12px 14px;min-height:104px;display:flex;flex-direction:column}
.slot .lb{font-size:14px;font-weight:600;color:var(--muted)}
.slot .val{font-family:var(--display);font-size:22px;line-height:1.15;margin-top:4px;overflow-wrap:anywhere;flex:1}
.slot .by{font-size:14px;font-weight:500;margin-top:6px}
.slot.found{background:var(--go);color:var(--on-go)}
.slot.found .lb{color:inherit;opacity:.85}
.slot.missed{background:var(--soft)}
.ac{position:relative}
.ac-list{position:absolute;inset-inline:0;top:100%;margin:6px 0 0;padding:4px;list-style:none;background:var(--panel);border:2.5px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--shadow);z-index:20;max-height:280px;overflow:auto}
.ac-list button{width:100%;text-align:start;padding:12px;border:0;background:none;color:var(--ink);font:500 17px var(--body);border-radius:10px;cursor:pointer}
.ac-list button:active,.ac-list button:hover{background:var(--soft)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.shake{animation:shake .4s}
.rhead{font-family:var(--display);font-size:24px;margin-bottom:12px}
.rbody{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.rbody img{width:92px;height:92px;border-radius:14px;border:2.5px solid var(--ink);object-fit:cover;flex:none;background:var(--soft)}
.rtitle{font-family:var(--display);font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.rartist{font-weight:500;font-size:18px;margin-top:2px}
.board{list-style:none;margin:0;padding:0;counter-reset:r}
.board li{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:2px dashed var(--soft);font-weight:500;font-size:18px}
.board li:last-child{border-bottom:0}
.board li .rk{font-family:var(--display);width:28px;text-align:center;flex:none}
.board li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .sc{font-family:var(--display);font-size:22px}
.board li.me{background:var(--soft);border-radius:12px;padding-inline:8px}
.board li.off{opacity:.5}
.board.big li{font-size:20px;padding:12px 4px}
.board.big li:first-child .sc{color:var(--hot)}
.winner{font-family:var(--display);font-size:30px;margin:8px 0 0}

/* lists & library */
.sub{color:var(--muted);font-weight:500;margin:0 0 12px}
select{width:100%;font:500 17px var(--body);padding:10px 12px;border:2.5px solid var(--ink);border-radius:14px;background:var(--panel);color:var(--ink);min-height:50px}
textarea{width:100%;font:500 16px var(--body);padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--panel);color:var(--ink);resize:vertical;min-height:110px}
textarea::placeholder{color:var(--muted);opacity:.85}
.more summary{cursor:pointer;font-weight:600;padding:8px 0}
.songlist{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.songlist li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px dashed var(--soft)}
.songlist li:last-child{border-bottom:0}
.songlist .si{flex:1;min-width:0}
.songlist .st{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songlist .sa{display:block;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{flex:none;min-width:44px;height:40px;border:2px solid var(--ink);border-radius:999px;background:var(--panel);color:var(--ink);font:600 15px var(--body);padding:0 12px;cursor:pointer}
.mini.on{background:var(--go);color:var(--on-go)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--ink);border-radius:999px;background:var(--soft);color:var(--ink);font:500 14px var(--body);padding:6px 12px;cursor:pointer;text-align:start}
.chips button.done{text-decoration:line-through;opacity:.5}
.ricon{width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none;font-size:22px}
.danger{color:var(--hot)}

/* host bar */
.hostbar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.hostbar .inner{max-width:520px;margin:0 auto;display:flex;gap:10px}
.hostbar .btn{flex:1;border-color:var(--bg);box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.hostcap{max-width:520px;margin:0 auto 8px;color:var(--bg);font-size:14px;font-weight:600;opacity:.85}

/* toast */
.toast{position:fixed;inset-inline:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:50;max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);font-weight:600;font-size:18px;padding:14px 18px;border-radius:16px;box-shadow:4px 4px 0 rgba(0,0,0,.3);text-align:center;transform:translateY(-140%);transition:transform .25s}
.toast.show{transform:translateY(0)}
.toast.good{background:var(--go);color:var(--on-go)}

/* dialog */
dialog{border:2.5px solid var(--ink);border-radius:22px;background:var(--panel);color:var(--ink);padding:20px;width:min(92vw,440px);box-shadow:6px 6px 0 var(--shadow)}
dialog::backdrop{background:rgba(27,23,32,.6)}
dialog h2{margin-bottom:16px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-height:46px;padding:8px 14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--panel);color:var(--ink);font:600 16px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.stack{display:grid;gap:10px;margin-top:8px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bell" viewBox="0 0 64 64">
      <g class="bellsvg"><path d="M32 6c-1.7 0-3 1.3-3 3v1.6C21.6 12.1 17 18.5 17 26.5V35l-5 6.8V44h40v-2.2L47 35v-8.5c0-8-4.6-14.4-12-15.9V9c0-1.7-1.3-3-3-3z" fill="currentColor"/>
      <circle cx="32" cy="50.5" r="5" style="fill:var(--clap,var(--hot))" stroke="currentColor" stroke-width="2"/></g>
    </symbol>
    <symbol id="i-bell-off" viewBox="0 0 64 64">
      <path d="M32 6c-1.7 0-3 1.3-3 3v1.6C21.6 12.1 17 18.5 17 26.5V35l-5 6.8V44h40v-2.2L47 35v-8.5c0-8-4.6-14.4-12-15.9V9c0-1.7-1.3-3-3-3z" fill="currentColor" opacity=".35"/>
      <path d="M10 10l44 44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <circle cx="16" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="2.4"/>

/* ---------- Deezer (JSONP, no key needed) ---------- */
let jsonpN = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function dz(path, params) {
  for (let k = 0; ; k++) {
    try { return await dzOnce(path, params); }
    catch (e) { if (e.code !== 4 || k >= 4) throw e; await sleep(1200 * (k + 1)); }
  }
}
function dzOnce(path, params) {
  return new Promise((resolve, reject) => {
    const cb = '__dz' + (++jsonpN) + '_' + Date.now();
    const q = new URLSearchParams(Object.assign({}, params || {}, { output: 'jsonp', callback: cb }));
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 15000);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => {
      done();
      if (!data || data.error) {
        const err = new Error((data && data.error && data.error.message) || 'deezer');
        err.code = data && data.error && data.error.code;
        reject(err);
      }
      else resolve(data);
    };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = 'https://api.deezer.com/' + path + '?' + q.toString();
    document.head.appendChild(s);
  });
}

/* ---------- Sound ---------- */
const P = { audio: new Audio(), id: null, ready: null, meta: null, token: 0, stopT: null, needTap: false, playing: false, loading: false, err: false };
P.audio.preload = 'auto';
P.audio.addEventListener('play', () => { P.playing = true; updatePlayBtn(); });
P.audio.addEventListener('pause', () => { P.playing = false; updatePlayBtn(); });
P.audio.addEventListener('ended', () => { P.playing = false; updatePlayBtn(); });

function loadTrack(id) {
  if (P.id === id && P.ready) return P.ready;
  stopAudio();
  P.id = id; P.meta = null; P.err = false; P.loading = true; updateStageHint();
  const pr = dz('track/' + id).then(d => {
    if (!d.preview) throw new Error('nopreview');
    if (P.id !== id) return;
    P.meta = d;
    return new Promise((resolve, reject) => {
      const a = P.audio;
      const ok = () => { clean(); resolve(); };
      const bad = () => { clean(); reject(new Error('audio')); };
      const tm = setTimeout(ok, 8000);
      function clean() { clearTimeout(tm); a.removeEventListener('canplaythrough', ok); a.removeEventListener('error', bad); }
      a.addEventListener('canplaythrough', ok);
      a.addEventListener('error', bad);
      a.src = d.preview;
      a.load();
    });
  });
  P.ready = pr;
  pr.then(() => { if (P.id === id) { P.loading = false; updateStageHint(); renderReveal(); } },
          () => { if (P.id === id) { P.ready = null; P.loading = false; P.err = true; updateStageHint(); } });
  return pr;
}

const userVol = () => clamp(prefs.vol == null ? 1 : +prefs.vol, 0, 1);
let fadeT = null;
function setVol(v) { try { P.audio.volume = clamp(v, 0, 1); } catch (e) {} }
/* Short fades in and out, so a clip never starts or stops with a click. */
function fadeTo(target, ms, done) {
  clearInterval(fadeT); fadeT = null;
  const a = P.audio, from = a.volume, t0 = performance.now();
  if (ms <= 0) { setVol(target); if (done) done(); return; }
  fadeT = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    setVol(from + (target - from) * k);
    if (k >= 1) { clearInterval(fadeT); fadeT = null; if (done) done(); }
  }, 16);
}

async function playClip(id, sec) {
  const token = ++P.token;
  clearTimeout(P.stopT); clearInterval(fadeT);
  try { await loadTrack(id); } catch (e) { return; }
  if (token !== P.token || P.id !== id) return;
  const a = P.audio;
  a.pause();
  try { a.currentTime = 0; } catch (e) {}
  setVol(0);
  pauseFull();
  try {
    await a.play();
    P.needTap = false;
  } catch (e) {

/* If the game is open twice on one device (a tab and the installed app, say),

if (bcast) bcast.onmessage = e => {

/* ---------- Full song inside the game (official embedded players) ---------- */
const FULL = { cache: {}, key: null, kind: null, ctrl: null, sp: null, yt: null, quietUntil: 0 };
function loadScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.async = true;
    el.onload = () => res(); el.onerror = () => rej(new Error('script'));
    document.head.appendChild(el);
  });
}
function spotifyApi() {
  if (!FULL.sp) FULL.sp = new Promise(res => {
    window.onSpotifyIframeApiReady = api => res(api);
    loadScript('https://open.spotify.com/embed/iframe-api/v1').catch(() => res(null));
    setTimeout(() => res(null), 10000);
  });
  return FULL.sp;
}
function ytApi() {
  if (!FULL.yt) FULL.yt = new Promise(res => {
    if (window.YT && window.YT.Player) return res(window.YT);
    window.onYouTubeIframeAPIReady = () => res(window.YT);
    loadScript('https://www.youtube.com/iframe_api').catch(() => res(null));
    setTimeout(() => res(null), 10000);
  });

}
/* Finds the same song on Spotify and YouTube (song.link matches it by the Deezer track). */
async function findLinks(id) {
  if (FULL.cache[id]) return FULL.cache[id];
  let out = {};
  try {
    const r = await fetch('https://api.song.link/v1-alpha.1/links?userCountry=IL&url=' + encodeURIComponent('https://www.deezer.com/track/' + id));
    if (r.ok) {
      const j = await r.json(), L = j.linksByPlatform || {};
      const sp = ((L.spotify && L.spotify.url) || '').match(/track\/([A-Za-z0-9]{10,})/);
      const yu = (L.youtube && L.youtube.url) || (L.youtubeMusic && L.youtubeMusic.url) || '';
      const yt = yu.match(/[?&]v=([\w-]{11})/);
      out = { sp: sp && sp[1], yt: yt && yt[1] };
      FULL.cache[id] = out;
    }
  } catch (e) {}
  return out;
}
function clearFull() {
  try { if (FULL.ctrl && FULL.ctrl.destroy) FULL.ctrl.destroy(); } catch (e) {}
  FULL.ctrl = null; FULL.kind = null; FULL.key = null;
  const box = $('#g-full'); if (box) box.innerHTML = '';
  const n = $('#g-fullnote'); if (n) n.classList.add('hidden');
}
function pauseFull() {
  FULL.quietUntil = performance.now() + 900;
  try {
    if (!FULL.ctrl) return;
    if (FULL.kind === 'sp') FULL.ctrl.pause();
    else if (FULL.kind === 'yt' && FULL.ctrl.pauseVideo) FULL.ctrl.pauseVideo();
  } catch (e) {}
}
function fullStarted() { if (performance.now() > FULL.quietUntil) stopAudio(); }
async function showFull(tr) {
  const app = prefs.app, key = tr.id + '|' + app;
  if (FULL.key === key) return;
  clearFull(); FULL.key = key;
  if (!['spotify', 'youtube', 'ytmusic'].includes(app)) return;
  const box = $('#g-full');
  box.innerHTML = `<p class="fullnote">${esc(t('fullLoading'))}</p>`;
  const links = await findLinks(tr.id);
  if (FULL.key !== key) return;
  box.innerHTML = '';
  if (app === 'spotify' && links.sp) {
    const el = document.createElement('div'); box.appendChild(el);
    const n = $('#g-fullnote'); n.textContent = t('fullSpNote'); n.classList.remove('hidden');
    const api = await spotifyApi();
    if (FULL.key !== key) return;
    if (api && api.createController) {
      api.createController(el, { uri: 'spotify:track:' + links.sp, width: '100%', height: 152 }, ctrl => {
        if (FULL.key !== key) { try { ctrl.destroy(); } catch (e) {} return; }
        FULL.ctrl = ctrl; FULL.kind = 'sp';
        ctrl.addListener('playback_update', ev => { const d = ev && ev.data; if (d && !d.isPaused && !d.isBuffering) fullStarted(); });
      });
    } else {
      el.outerHTML = `<iframe src="https://open.spotify.com/embed/track/${esc(links.sp)}" height="152" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
    }
  } else if ((app === 'youtube' || app === 'ytmusic') && links.yt) {
    const wrap = document.createElement('div'); wrap.className = 'ytbox';
    const el = document.createElement('div'); wrap.appendChild(el); box.appendChild(wrap);
    const YT = await ytApi();
    if (FULL.key !== key) return;
    if (YT && YT.Player) {
      FULL.kind = 'yt';
      FULL.ctrl = new YT.Player(el, { videoId: links.yt, width: '100%', height: '100%', playerVars: { playsinline: 1, rel: 0 },
        events: { onStateChange: ev => { if (ev.data === 1) fullStarted(); } } });
    } else {
      el.outerHTML = `<iframe src="https://www.youtube.com/embed/${esc(links.yt)}?playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    }
  }
}

let actx = null;
function unlockAudio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
function ding() {
  if (!prefs.sound || !actx) return;
  const t0 = actx.currentTime;
  [[1318.5, 0.16], [2637, 0.06], [3951, 0.025]].forEach(([f, g]) => {
    const o = actx.createOscillator(), v = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    v.gain.setValueAtTime(0.0001, t0);
    v.gain.exponentialRampToValueAtTime(g, t0 + 0.01);
    v.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.3);
    o.connect(v); v.connect(actx.destination);
    o.start(t0); o.stop(t0 + 1.35);
  });
}

async function joinRoom(code) {
  code = String(code || '').replace(/\D/g, '').slice(0, 4);
  if (code.length !== 4) { toast(t('needCode')); return; }
  try {
    const hs = await db.ref(`rooms/${code}/hostId`).get();

function enterRoom(code) {
  detach();
  S.code = code; S.room = null; S.lastKey = null; S.prevRound = null; S.tracksVer = null; S.renderedNum = null; S.editing = false;
  LS.set('last', code);

/* ---------- Room updates ---------- */
function onRoom(room) {
  if (!room) { toast(t('roomGone')); leaveRoom(true); return; }
  S.room = room;
  S.isHost = room.hostId === me.pid;
  const ver = room.settings && room.settings.ver;
  if (ver !== S.tracksVer) { S.tracksVer = ver; buildLists(room.tracks || []); }
  notify(room);
  S.prevRound = room.round ? Object.assign({}, room.round) : null;
  if (room.status !== 'ended') S.endRung = false;
  $('#dlg-leave').classList.remove('hidden');

  watchPlays();
  if (room.status === 'playing') handleAudio();

}

function renderCurrent() {
  const room = S.room; if (!room) return;
  if (S.editing) return;
  if (room.status === 'lobby') { show('lobby'); renderLobby(); }
  else if (room.status === 'playing') { show('game'); renderGame(); }
  else if (room.status === 'ended') { show('end'); renderEnd(); }
}

function buildLists(tracks) {
  const uniq = (arr) => {
    const m = new Map();
    arr.forEach(v => { const n = norm(v); if (n && !m.has(n)) m.set(n, { v, n, w: n.split(' ') }); });
    return Array.from(m.values()).sort((a, b) => a.v.localeCompare(b.v));

  S.titles = uniq(tracks.map(x => x && x.t));
}

function playerName(id) {
  const p = S.room && S.room.players && S.room.players[id];

}

const isTogether = () => !!(S.room && S.room.settings && S.room.settings.mode === 'together');
const canControl = () => !!(S.room && (S.isHost || isTogether()));

function notify(room) {
  const r = room.round, p = S.prevRound;
  if (!r || !p || r.num !== p.num || room.status !== 'playing') return;
  const newA = r.artistBy && !p.artistBy, newT = r.titleBy && !p.titleBy;
  if (!newA && !newT) return;
  const who = newT ? r.titleBy : r.artistBy;
  const msg = newT ? t('gotTitle', { name: playerName(who) }) : t('gotArtist', { name: playerName(who) });
  toast(msg, true);
  ding();
  ring($('#game-bell'));
}

function handleAudio() {
  const room = S.room, r = room.round;
  if (!r || !room.tracks || !room.tracks[r.idx]) return;
  const tr = room.tracks[r.idx];
  const key = r.num + '|' + r.level + '|' + r.state;
  if (key === S.lastKey) return;
  S.lastKey = key;
  if (!prefs.sound || P.yielded || hostOnlySound()) { loadTrack(tr.id).catch(() => {}); updateStageHint(); return; }
  playClip(tr.id, r.state === 'guessing' ? SLICES[r.level || 0] : null);

/* ---------- Live statistics ---------- */
const roundResult = r => ({ a: !!r.artistBy, t: !!r.titleBy });

  if (R) Object.keys(R).forEach(k => { if (R[k]) res[k] = R[k]; });
  const r = room.round;
  if (r && room.status === 'playing' && r.state === 'revealed' && !res[r.num]) res[r.num] = roundResult(r);
  const st = { played: 0, both: 0, song: 0, artist: 0, none: 0 };
  Object.values(res).forEach(x => {
    st.played++;
    if (x.a && x.t) st.both++; else if (x.t) st.song++; else if (x.a) st.artist++; else st.none++;
  });
  st.points = st.both * 3 + st.song * 2 + st.artist;
  return st;
}

/* ---------- Guessing ---------- */
function setupAC(kind) {
  const input = $('#in-' + kind), list = $('#ac-' + kind);
  const hide = () => { list.hidden = true; };
  const fill = () => {
    const q = norm(input.value);
    if (!q) { hide(); return; }
    const all = kind === 'artist' ? S.artists : S.titles;
    const a = [], b = [], c = [];
    for (const o of all) {
      if (o.n.startsWith(q)) a.push(o);
      else if (o.w.some(w => w.startsWith(q))) b.push(o);
      else if (o.n.includes(q)) c.push(o);
      if (a.length >= 8) break;
    }
    const res = a.concat(b, c).slice(0, 8);
    if (!res.length) { hide(); return; }
    list.innerHTML = res.map(o => `<li><button type="button" data-v="${esc(o.v)}">${esc(o.v)}</button></li>`).join('');
    list.hidden = false;
  };
  input.addEventListener('input', fill);
  input.addEventListener('focus', fill);
  input.addEventListener('blur', () => setTimeout(hide, 180));
  list.addEventListener('pointerdown', e => e.preventDefault());
  list.addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    input.value = btn.dataset.v; hide(); submitGuess(kind);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); hide(); submitGuess(kind); }
    if (e.key === 'Escape') hide();
  });
}

async function submitGuess(kind) {
  const room = S.room, r = room && room.round, tr = curTrack();
  const input = $('#in-' + kind);
  const text = input.value.trim();
  if (!r || !tr || r.state !== 'guessing' || !text) return;
  const target = kind === 'artist' ? tr.a : tr.t;
  if (norm(text) !== norm(target)) {
    input.value = '';
    input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
    toast(t('nope'));
    return;
  }
  const field = kind === 'artist' ? 'artistBy' : 'titleBy';
  const num = r.num;
  const pts = kind === 'title' ? 2 : 1;
  try {
    const res = await S.ref.child('round').transaction(cur => {
      if (!cur || cur.num !== num || cur.state !== 'guessing' || cur[field]) return;
      cur[field] = me.pid;
      if (cur.artistBy && cur.titleBy) cur.state = 'revealed';
      return cur;
    });
    if (!res.committed) { toast(t('tooLate')); return; }
    await S.ref.child('players/' + me.pid + '/score').transaction(s => (s || 0) + pts);
  } catch (e) { toast(t('netErr')); }
}

/* ---------- Host actions ---------- */
/* Songs are random, but songs heard in earlier games wait their turn:
   never-heard songs come first, then the ones heard longest ago. */
function playsKey() {
  const id = S.room && S.room.settings && S.room.settings.plId;
  return id ? String(id).replace(/[.#$\[\]\/]/g, '_') : null;
}
function watchPlays() {
  const k = (S.code && S.isHost) ? playsKey() : null;
  if (k === S.playsKey) return;
  if (S.playsRef && S.playsCb) S.playsRef.off('value', S.playsCb);
  S.playsKey = k; S.plays = {}; S.playsRef = null; S.playsCb = null;
  if (!k) return;
  S.playsRef = db.ref('plays/' + k);
  S.playsCb = S.playsRef.on('value', snap => { S.plays = snap.val() || {}; }, () => { S.plays = {}; });
}
function markPlayed(idx) {
  const k = playsKey(), tr = S.room && S.room.tracks && S.room.tracks[idx];
  if (k && tr) db.ref('plays/' + k + '/' + tr.id).set(SV).catch(() => {});
}
function pickIndex(played) {
  const tracks = S.room.tracks || [];
  const avail = [];
  for (let i = 0; i < tracks.length; i++) if (tracks[i] && !(played && played[i])) avail.push(i);
  if (!avail.length) return -1;
  const last = i => (S.plays && S.plays[tracks[i].id]) || 0;
  let pool = avail.filter(i => !last(i));
  if (!pool.length) {
    const sorted = avail.slice().sort((a, b) => last(a) - last(b));
    pool = sorted.slice(0, Math.max(1, Math.ceil(sorted.length * 0.3)));
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

async function startGame() {
  const idx = pickIndex(null);
  if (idx < 0) return;
  const up = { status: 'playing', startedAt: SV, played: { [idx]: true }, results: null, round: { num: 1, idx, level: 0, state: 'guessing' } };
  sortedPlayers().forEach(p => { up['players/' + p.id + '/score'] = 0; });
  try { await S.ref.update(up); markPlayed(idx); } catch (e) { toast(t('netErr')); }
}

async function nextSong() {
  const room = S.room, st = room.settings || {}, r = room.round;
  const num = r ? r.num : 0;
  if (r && !(room.results && room.results[num])) {
    try { await S.ref.child('results/' + num).set(roundResult(r)); } catch (e) {}
  }
  if (st.endMode === 'songs' && num >= st.endValue) return endGame();
  if (st.endMode === 'time' && room.startedAt && now() - room.startedAt >= st.endValue * 60000) return endGame();
  const idx = pickIndex(room.played);
  if (idx < 0) { toast(t('outOfSongs')); return endGame(); }
  const up = {};
  up['played/' + idx] = true;
  up.round = { num: num + 1, idx, level: 0, state: 'guessing' };
  try { await S.ref.update(up); markPlayed(idx); } catch (e) { toast(t('netErr')); }
}

async function endGame() {
  const room = S.room, r = room && room.round, up = { status: 'ended' };
  if (r && room.status === 'playing' && !(room.results && room.results[r.num]) && (r.state === 'revealed' || r.artistBy || r.titleBy)) {
    up['results/' + r.num] = roundResult(r);
  }
  try { await S.ref.update(up); } catch (e) { toast(t('netErr')); }
}

/* Year hint: the earliest release year among this artist's versions of the song,
   so a greatest-hits album or a remaster doesn't give a late year. */
async function findYear(tr) {
  const years = [];
  const add = d => { const y = parseInt(String((d && d.release_date) || '').slice(0, 4), 10); if (y > 1900 && y <= new Date().getFullYear()) years.push(y); };
  try { add(P.meta && P.meta.id === tr.id ? P.meta : await dz('track/' + tr.id)); } catch (e) {}
  let cands = [];
  try {
    const q = `artist:"${String(tr.a).replace(/"/g, '')}" track:"${cleanTitle(tr.t).replace(/"/g, '')}"`;
    const r = await dz('search', { q, limit: 25 });
    const want = norm(cleanTitle(tr.t)), wa = norm(firstArtist(tr.a));
    cands = (r.data || []).filter(c => c && c.id !== tr.id && c.artist && norm(firstArtist(c.artist.name)) === wa
      && norm(cleanTitle(c.title_short || c.title)) === want && !isCover(c)).slice(0, 8);
  } catch (e) {}
  await pool(cands, 3, async c => { try { add(await dz('track/' + c.id)); } catch (e) {} });
  return years.length ? Math.min(...years) : null;
}

async function hostAction(act, btn, arg) {
  if (!canControl() || !S.ref) return;
  if (btn && act !== 'level') { btn.disabled = true; setTimeout(() => { btn.disabled = false; }, 700); }
  if (act === 'level') {
    const i = clamp(+arg || 0, 0, MAX_LEVEL), r = S.room.round, tr = curTrack();
    if (!r || r.state !== 'guessing') return;
    if ((r.level || 0) === i) { if (tr) { claimTab(); unlockAudio(); playClip(tr.id, SLICES[i]); } return; }
    S.ref.child('round').transaction(cur => {
      if (!cur || cur.state !== 'guessing' || (cur.level || 0) === i) return;
      cur.level = i; return cur;
    });
  } else if (act === 'hint') {
    const r = S.room.round, tr = curTrack();
    if (!r || !tr || r.hint || S.hintBusy) return;
    const num = r.num;
    S.hintBusy = true; renderGame();
    const y = await findYear(tr);
    S.hintBusy = false;
    try {
      await S.ref.child('round').transaction(cur => {
        if (!cur || cur.num !== num || cur.hint) return;
        cur.hint = y || -1; return cur;
      });
    } catch (e) { toast(t('netErr')); }
    if (S.room && S.room.status === 'playing') renderGame();
  } else if (act === 'more') {
    S.ref.child('round').transaction(r => {
      if (!r || r.state !== 'guessing' || (r.level || 0) >= MAX_LEVEL) return;
      r.level = (r.level || 0) + 1; return r;
    });
  } else if (act === 'giveup') {
    S.ref.child('round').transaction(r => {
      if (!r || r.state !== 'guessing') return;
      r.state = 'revealed'; r.gaveUp = true; return r;
    });
  } else if (act === 'next') {
    nextSong();
  }
}

function parsePlaylist(s) {
  s = String(s || '').trim();
  if (!s) return null;
  if (/link\.deezer\.com|deezer\.page\.link|dzr\.page\.link/i.test(s)) return { short: true };
  const m = s.match(/playlist\/(\d+)/i) || s.match(/^(\d{3,})$/);
  return m ? { id: m[1] } : null;
}

const mkTrack = x => ({ id: x.id, t: x.title_short || x.title, a: x.artist.name });
const playable = x => x && x.id && x.readable !== false && x.preview && x.artist;
/* Karaoke, tribute and "made famous by" versions are left out. */
const COVER_RE = /karaoke|tribute|cover(ed)? by|\(cover\)|cover version|made famous|in the style of|originally (performed|by|recorded)|backing track|instrumental version|8[- ]?bit|lullaby|music box|sing[- ]?along|re-?recorded by|performed by|playback version|as popularized/i;
const isCover = x => COVER_RE.test([x.title, x.title_version, x.artist && x.artist.name, x.album && x.album.title].filter(Boolean).join(' | '));
const goodTrack = x => playable(x) && !isCover(x);

async function fetchPlaylistTracks(id, onProgress) {
  const info = await dz('playlist/' + id);
  const total = Math.min(info.nb_tracks || 0, MAX_TRACKS);
  const seen = new Set(), tracks = [];
  for (let index = 0; index < total; index += 100) {
    const page = await dz(`playlist/${id}/tracks`, { index, limit: 100 });
    (page.data || []).forEach(x => {
      if (goodTrack(x) && !seen.has(x.id)) { seen.add(x.id); tracks.push(mkTrack(x)); }
    });
    if (onProgress) onProgress(tracks.length, info);
    if (!page.next) break;
  }
  return { info, tracks };
}

async function loadPlaylist(id, hint) {

  } finally {

}

function edAdd(list) {
  const ed = S.ed; let added = 0, dup = 0;
  if (!ed) return { added, dup };
  list.forEach(x => {
    const k = trackKey(x);
    if (ed.ids.has(x.id) || ed.keys.has(k)) { dup++; return; }

  });
  if (added) { edSave(); renderEditorSongs(); }
  return { added, dup };
}

/* --- import from a Spotify export (file or pasted text) --- */
function parseCSV(text, delim) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}

function parseImport(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  const first = (text.split(/\r?\n/).find(l => l.trim()) || '');
  const delim = ['\t', ';', ','].map(d => [d, first.split(d).length - 1]).sort((a, b) => b[1] - a[1])[0];
  const items = [], seen = new Set();
  const push = it => { const k = norm(it.raw); if (k && !seen.has(k)) { seen.add(k); items.push(it); } };
  if (delim[1] > 0 && /artist|title|track|song|name/i.test(first)) {
    const rows = parseCSV(text, delim[0]);
    const head = rows[0].map(h => String(h).trim().toLowerCase());
    const find = (re, not) => head.findIndex(h => re.test(h) && !(not && not.test(h)));
    let ti = find(/^(track ?name|song ?name|title|track|song|name)$/);
    if (ti < 0) ti = find(/track|title|song/, /artist|album|id|isrc|playlist|uri|url/);
    const ai = find(/artist/, /album/);
    const ii = find(/isrc/);
    rows.slice(1).forEach(r => {
      const title = ti >= 0 ? String(r[ti] || '').trim() : '';
      const artist = ai >= 0 ? String(r[ai] || '').trim() : '';
      const isrc = ii >= 0 ? String(r[ii] || '').trim() : '';
      if (title || artist) push({ title, artist, isrc, raw: [artist, title].filter(Boolean).join(' - ') });
    });
  } else {
    text.split(/\r?\n/).forEach(line => {
      let l = line.trim().replace(/^\d+[\.\)]\s+/, '');
      if (!l) return;
      const parts = l.split(/\s+[-\u2013\u2014]\s+|\t/);
      if (parts.length >= 2) push({ p1: parts[0].trim(), p2: parts.slice(1).join(' - ').trim(), raw: l });
      else push({ raw: l });
    });
  }
  return items;
}

const cleanTitle = s => String(s || '')
  .replace(/\s*[\(\[][^\)\]]*[\)\]]/g, m => /remaster|feat|ft\.|version|mono|stereo|edit|bonus|deluxe|live|mix|from /i.test(m) ? '' : m)
  .replace(/\s+-\s+.*(remaster|version|edit|mono|stereo|live|mix).*$/i, '').trim();
const firstArtist = s => String(s || '').split(/\s*(?:,|;|&|\sfeat\.?\s|\sft\.?\s|\sx\s)\s*/i)[0].trim();
const toks = s => new Set(norm(cleanTitle(s)).split(' ').filter(w => w && !['the', 'a', 'feat', 'ft'].includes(w)));
function dice(a, b) {
  if (!a.size || !b.size) return 0;
  let n = 0; a.forEach(w => { if (b.has(w)) n++; });
  return 2 * n / (a.size + b.size);
}
function scoreCand(c, it) {
  const ct = toks(c.title_short || c.title), ca = toks(c.artist.name);
  if (it.title || it.artist) return dice(toks(it.title), ct) * 0.6 + dice(toks(firstArtist(it.artist)), ca) * 0.4;
  if (it.p1) {
    const a = dice(toks(it.p1), ca) * 0.4 + dice(toks(it.p2), ct) * 0.6;
    const b = dice(toks(it.p2), ca) * 0.4 + dice(toks(it.p1), ct) * 0.6;
    return Math.max(a, b);
  }
  const r = toks(it.raw), both = new Set([...ct, ...ca]);
  return dice(both, r);
}
async function searchTracks(q, limit) {
  try {
    const r = await dz('search', { q, limit: limit || 10 });
    return (r.data || []).filter(goodTrack);
  } catch (e) { if (e.message === 'network' || e.message === 'timeout') throw e; return []; }
}
function bestOf(cands, it) {
  const ok = cands.map(c => ({ c, s: scoreCand(c, it) })).filter(o => o.s >= 0.6);
  if (!ok.length) return null;
  const top = Math.max(...ok.map(o => o.s));
  /* among near-equal matches, take the most popular (usually the original) */
  const near = ok.filter(o => o.s >= top - 0.1).sort((a, b) => (b.c.rank || 0) - (a.c.rank || 0));
  return mkTrack(near[0].c);
}
function searchTextFor(it) {
  if (it.title || it.artist) return (firstArtist(it.artist) + ' ' + cleanTitle(it.title)).trim();
  return it.raw.replace(/\s+[-\u2013\u2014]\s+|\t/g, ' ');
}
async function matchItem(it) {
  if (it.isrc) {
    try { const d = await dz('track/isrc:' + encodeURIComponent(it.isrc)); if (playable(d)) return mkTrack(d); } catch (e) {}
  }
  if (it.title && it.artist) {
    const q = `artist:"${firstArtist(it.artist).replace(/"/g, '')}" track:"${cleanTitle(it.title).replace(/"/g, '')}"`;
    const hit = bestOf(await searchTracks(q, 5), it);
    if (hit) return hit;
  }
  return bestOf(await searchTracks(searchTextFor(it), 10), it);
}
async function pool(items, n, fn) {
  let i = 0;
  const worker = async () => { while (i < items.length) { const it = items[i++]; await fn(it); } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
}

async function runImport(text) {
  if (S.importing || !S.ed) return;
  const items = parseImport(text);
  if (!items.length) { edMsg('#ed-imp-msg', t('nothingToImport'), true); return; }
  S.importing = true;
  const btn = $('#ed-import'); btn.disabled = true;
  $('#ed-missing').classList.add('hidden');
  const found = [], missing = []; let done = 0, netFail = false;
  edMsg('#ed-imp-msg', t('finding', { n: 0, total: items.length }));
  await pool(items, 3, async it => {
    let tr = null;
    try { tr = await matchItem(it); } catch (e) { netFail = true; }
    if (tr) found.push(tr); else missing.push(it);
    done++;
    edMsg('#ed-imp-msg', t('finding', { n: done, total: items.length }));
  });
  const r = edAdd(found);
  edMsg('#ed-imp-msg', t('importDone', { found: r.added, dup: r.dup }));
  if (netFail) toast(t('netErr'));
  renderMissing(missing);
  if (r.added || r.dup) $('#ed-paste').value = '';
  S.importing = false; btn.disabled = false;
}

function renderMissing(list) {

async function addToRoom(x, btn) {
  if (!S.ref || !x) return;
  if (btn) btn.disabled = true;
  const k = trackKey(x);
  const item = { id: x.id, t: x.t, a: x.a };
  try {
    const res = await S.ref.child('tracks').transaction(cur => {
      if (!cur) return;
      const arr = asArray(cur);
      if (arr.some(sameTrack(x, k))) return;
      arr.push(item); return arr;
    });
    if (!res.committed) { edMsg('#add-msg', t('alreadyInGame')); renderAddRes(); return; }
    await S.ref.child('settings/ver').set(Date.now());
    const lid = $('#add-list').value || null;
    if (lid && S.lists[lid]) {
      const r2 = await db.ref('listTracks/' + lid).transaction(cur => {
        const arr = asArray(cur);
        if (arr.some(sameTrack(x, k))) return;
        arr.push(item); return arr;
      });
      if (r2.committed) await db.ref('lists/' + lid).update({ count: asArray(r2.snapshot.val()).length, updatedAt: SV });
    }
    if ($('#dlg-add').open) edMsg('#add-msg', t('songAdded')); else toast(t('songAdded'), true);
    renderAddRes();
  } catch (e) { toast(t('netErr')); if (btn) btn.disabled = false; }

});
$('#g-stops').addEventListener('click', e => {
  const b = e.target.closest('[data-level]');
  if (b && !b.disabled) hostAction('level', b, b.dataset.level);
});
$('#g-trk').addEventListener('click', e => {
  if (!$('#g-trk').classList.contains('tap')) return;
  const rc = $('#g-trk').getBoundingClientRect();
  let x = (e.clientX - rc.left) / rc.width;
  if (document.documentElement.dir === 'rtl') x = 1 - x;
  hostAction('level', null, Math.round(clamp(x, 0, 1) * MAX_LEVEL));
});
$('#vol').addEventListener('input', e => {
  prefs.vol = clamp((+e.target.value || 0) / 100, 0, 1); LS.set('vol', prefs.vol);
  if (!fadeT) setVol(userVol());
});
$('#g-listen').addEventListener('click', () => { stopAudio(); pauseFull(); });
$('#g-end').addEventListener('click', () => { if (confirm(t('confirmEnd'))) endGame(); });

$('#btn-again').addEventListener('click', () => { S.endRung = false; S.ref.update({ status: 'lobby', round: null, played: null, results: null }); });
$('#btn-newmusic').addEventListener('click', () => openSetup('edit'));
$('#btn-leave-end').addEventListener('click', () => leaveRoom());
$('#dlg-leave').addEventListener('click', () => { $('#dlg').close(); leaveRoom(); });
$('#dlg-close').addEventListener('click', () => $('#dlg').close());
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });

$('#btn-lib').addEventListener('click', () => openLibrary('home'));
$('#setup-manage').addEventListener('click', () => openLibrary('setup'));
$('#lib-back').addEventListener('click', () => {
  if (S.libReturn === 'setup') { renderSetupLists(); show('setup'); } else show('home');
});
$('#lib-create').addEventListener('click', createList);
$('#lib-new').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); createList(); } });
$('#ed-back').addEventListener('click', () => { S.ed = null; openLibrary(); });
$('#ed-name').addEventListener('change', () => {
  const n = $('#ed-name').value.trim().slice(0, 40);
  if (!S.ed) return;
  if (!n) { $('#ed-name').value = S.ed.name; return; }
  S.ed.name = n; edSave();
});
$('#ed-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const txt = String(rd.result || ''); $('#ed-paste').value = txt; runImport(txt); };
  rd.readAsText(f);
  e.target.value = '';
});
$('#ed-import').addEventListener('click', () => runImport($('#ed-paste').value));
$('#ed-search').addEventListener('click', edSearch);
$('#ed-q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); edSearch(); } });
$('#ed-psearch').addEventListener('click', edPlaylistSearch);
$('#ed-pq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); edPlaylistSearch(); } });
$('#ed-addall').addEventListener('click', () => {
  if (!S.edPl) return;
  const r = edAdd(S.edPl.tracks);
  toast(t('importDone', { found: r.added, dup: r.dup }), true);
});
$('#ed-filter').addEventListener('input', renderEditorSongs);
$('#ed-delete').addEventListener('click', async () => {
  const ed = S.ed; if (!ed) return;
  if (!confirm(t('confirmDelete', { name: ed.name }))) return;
  try {
    clearTimeout(edSaveT);
    await db.ref().update({ ['lists/' + ed.id]: null, ['listTracks/' + ed.id]: null });
    S.ed = null; openLibrary();
  } catch (e) { toast(t('netErr')); }
});
$('#pl-peek-btn').addEventListener('click', togglePeek);
$('#ed-play').addEventListener('click', () => {
  const ed = S.ed; if (!ed) return;
  if (!ed.tracks.length) { toast(t('listEmptyPick')); return; }
  const chosen = { id: 'lib:' + ed.id, title: ed.name, pic: '', tracks: ed.tracks.slice() };
  const intoRoom = S.libReturn === 'setup' && S.setupMode === 'edit' && S.room;
  if (!intoRoom) {
    const n = (me.name || $('#name').value || '').trim();
    if (!n) { show('home'); toast(t('needName')); $('#name').focus(); return; }
    me.name = n.slice(0, 20); LS.set('name', me.name); $('#name').value = me.name;
    openSetup('create');
  } else {
    show('setup');
  }
  S.libReturn = 'setup';
  S.pl = chosen; setMsg(''); renderPicked(); renderSetupLists();
  setTimeout(() => $('#pl-card').scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
});
$('#lib-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) newListFromFile(f);
});
$('#add-search').addEventListener('click', addSearch);
$('#add-q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addSearch(); } });
$('#add-close').addEventListener('click', () => $('#dlg-add').close());
$('#add-list').addEventListener('change', e => LS.set('addList', e.target.value));
$('#dlg-add').addEventListener('click', e => { if (e.target === $('#dlg-add')) $('#dlg-add').close(); });

setupAC('artist');
setupAC('title');

setInterval(() => {
  if (S.screen === 'game' && S.room) $('#g-time').textContent = timeLabel();
}, 10000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.code && S.connRef) {
    db.ref(`rooms/${S.code}/players/${me.pid}/online`).set(true).catch(() => {});
  }
});

/* ---------- Start ---------- */
$('#name').value = me.name;
const urlCode = new URLSearchParams(location.search).get('room');
if (urlCode) $('#join-code').value = urlCode.replace(/\D/g, '').slice(0, 4);
applyLang();
document.addEventListener('animationend', e => { if (e.target.classList) e.target.classList.remove('ring', 'shake'); });

/* ---------- Install button (Android Chrome) ---------- */
let installEvt = null;
const isInstalled = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  if (isInstalled()) return;
  installEvt = e;
  $('#btn-install').classList.remove('hidden');
});
$('#btn-install').addEventListener('click', async () => {
  if (!installEvt) return;
  const evt = installEvt; installEvt = null;
  $('#btn-install').classList.add('hidden');
  try { await evt.prompt(); await evt.userChoice; } catch (e) {}
});
window.addEventListener('appinstalled', () => {
  installEvt = null;
  $('#btn-install').classList.add('hidden');
  toast(t('installed'), true);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
